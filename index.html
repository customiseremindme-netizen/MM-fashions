<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1C1F26" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Theme before first paint: the saved choice, else the system setting. -->
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem("mm-fashions:theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        var d = document.documentElement;
        d.setAttribute("data-theme", t);
        d.style.colorScheme = t;
        if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0B0C0F");
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/fonts/poppins-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!--seo-->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px">
        M.M Fashions — Mfrs of hosiery garments, sports wear, regular and house uniforms. Call +91 99524 01313 or email
        mmfashionstirupur@gmail.com.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
